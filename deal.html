<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Deal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="dealTitle">Deal</h1>
    <nav>
      <a href="index.html">Deals</a>
      <a href="track.html">Track Record</a>
    </nav>
  </header>

  <main class="container">
    <div class="twoCol">
      <section class="card">
        <h2>Deal Facts</h2>
        <div id="dealFacts" class="kv"></div>
      </section>
     


      <section class="card">
        <h2>Your Assumptions</h2>

        <div class="formGrid">
          <label>Hold (years)
            <input id="holdYears" type="number" min="3" max="10" step="1" value="5">
          </label>

          <label>Rent growth (%)
            <input id="rentGrowth" type="number" step="0.1" value="3.0">
          </label>

          <label>Expense growth (%)
            <input id="expGrowth" type="number" step="0.1" value="3.0">
          </label>

          <label>Vacancy (%)
            <input id="vacancy" type="number" step="0.1" value="6.0">
          </label>

          <label>Rent premium at stabilization ($/unit)
            <input id="rentPremium" type="number" step="25" value="150">
          </label>

          <label>Exit cap (%)
            <input id="exitCap" type="number" step="0.05" value="6.25">
          </label>

          <label>LTV (%)
            <input id="ltv" type="number" step="1" value="70">
          </label>

          <label>Rate (%)
            <input id="rate" type="number" step="0.05" value="7.25">
          </label>
        </div>

        <button id="recalc" class="btn">Recalculate</button>
      </section>
    </div>

    <section class="card">
      <h2>Results</h2>
      <div id="results" class="kv"></div>
    </section>
 <section class="card">
  <h2>T12 (Trailing 12)</h2>
  <div id="t12Table"></div>
</section>

<section class="card">
  <h2>Pro Forma (Updates with your assumptions)</h2>
  <div id="pfTable"></div>
</section>
    <section class="card">
      <h2>Your Decision</h2>
      <label>Decision</label>
      <div class="row">
        <button class="btn" id="btnBuy">BUY</button>
        <button class="btn secondary" id="btnPass">PASS</button>
      </div>

      <div class="formGrid">
        <label>Your thesis (1–3 bullets)
          <textarea id="thesis" rows="3" placeholder="Example: Rent lift is realistic; DSCR stays above 1.25; exit cap sensitivity acceptable."></textarea>
        </label>

        <label>Biggest risk (1 bullet)
          <input id="risk" type="text" placeholder="Example: Tax reassessment pushes expenses up.">
        </label>

        <label>Confidence (1–5)
          <input id="confidence" type="number" min="1" max="5" value="3">
        </label>
      </div>

      <button id="btnReveal" class="btn">Reveal Coach Review</button>
    </section>

    <section class="card" id="coachCard" style="display:none;">
      <h2>Coach Review</h2>
      <div id="coachOut"></div>
    </section>
  </main>

  <script src="js/calc.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.initDealPage();
  </script>
</body>
</html>
